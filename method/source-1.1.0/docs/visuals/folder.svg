<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" role="img" aria-label="What lives in a harness folder, and who writes it"><title>What lives in a harness folder, and who writes it</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect width="1060" height="760" fill="#ffffff"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">What lives in a harness folder, and who writes it</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">One folder is the whole application. Every file can be opened, read, and moved to another model.</text><text x="28" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="start">PATH</text><text x="402" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="start">HOLDS</text><text x="766" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="start">WRITTEN BY</text><rect x="20" y="106" width="1020" height="34" fill="#f6f8fa"/><rect x="28" y="112" width="362" height="22" rx="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="38" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">ABOUT_US.md · ROLE.md</text><text x="402" y="128" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the organisation; this harness&#x27;s role</text><text x="766" y="128" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">you</text><rect x="28" y="146" width="362" height="22" rx="5" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="38" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">AGENTS.md</text><text x="402" y="162" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the contract, generated from the two files above</text><text x="766" y="162" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">hoi-govern, then you via PROPOSED.md</text><rect x="20" y="174" width="1020" height="34" fill="#f6f8fa"/><rect x="28" y="180" width="362" height="22" rx="5" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="38" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">RULES · GOALS · TOOLS · FILESYSTEM …</text><text x="402" y="196" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the detail AGENTS.md points to, also SKILLS, EVALS</text><text x="766" y="196" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">hoi-govern, then you via PROPOSED.md</text><rect x="28" y="214" width="362" height="22" rx="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="38" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">PROPOSED.md</text><text x="402" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the review queue: every change waiting on you</text><text x="766" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">assistant writes, you decide</text><rect x="20" y="242" width="1020" height="34" fill="#f6f8fa"/><rect x="28" y="248" width="362" height="22" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="38" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">MEMORY.md</text><text x="402" y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">approved facts only: dated, sourced, review date</text><text x="766" y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">memory.py, after your approval</text><rect x="28" y="282" width="362" height="22" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="38" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">evals.json · skills.json · automations.json</text><text x="402" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">answer key, skill status, what runs alone</text><text x="766" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anc