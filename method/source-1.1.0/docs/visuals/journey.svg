<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img" aria-label="The method: 7 phases, 25 steps, 15 core skills"><title>The method: 7 phases, 25 steps, 15 core skills</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect width="960" height="710" fill="#ffffff"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">The method: 7 phases, 25 steps, 15 core skills</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Everything before phase 4 is setup; everything after it is proof. Each step has a « done when » gate.</text><text x="118" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="start">PHASE</text><text x="270" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="start">STEPS · WHAT HAPPENS · SKILLS (hoi-…)</text><text x="690" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#59636e" text-anchor="start">YOU HOLD AT THE END</text><rect x="28" y="108" width="212" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="46" y="138" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#59636e" text-anchor="start">0</text><text x="80" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start