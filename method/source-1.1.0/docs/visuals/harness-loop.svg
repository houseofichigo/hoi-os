<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Every control in the agent loop is a file in your folder"><title>Every control in the agent loop is a file in your folder</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect width="960" height="640" fill="#ffffff"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Every control in the agent loop is a file in your folder</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">The host (Codex, Claude Code…) runs the loop. The folder decides what the model sees, what it may touch, and when it stops.</text><rect x="30" y="96" width="280" height="104" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="44" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">1 · The ask arrives</text><text x="44" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">from you, a file in inbox/, or a schedule</text><text x="44" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the host starts the loop</text><text x="44" y="171" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Agent loop</text><rect x="340" y="96" width="280" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="354" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">2 · Context is assembled</text><text x="354" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">AGENTS.md · ROLE.md</text><text x="354" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">RULES.md · STATE.json</text><text x="354" y="171" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Context — re-read after compaction</text><rect x="650" y="96" width="280" height="104" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="664" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">3 · The model decides</text><text x="664" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">answer, or call a tool</text><text x="664" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">it sees only what step 2 gave it</text><text x="664" y="171" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Tool calling</text><rect x="650" y="276" width="280" height="104" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="664" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">4 · Permission check</text><text x="664" y="315" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">TOOLS.md: alone / with you / never</text><text x="664" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">guard plugin blocks before the call</text><text x="664" y="351" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Permissions and sandboxing</text><rect x="340" y="276" width="280" height="104" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="354" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">5 · The tool runs</text><text x="354" y="315" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">reads a file, queries an app</text><text x="354" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">writes only in work/ and wiki/</text><text x="354" y="351" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Tool calling</text><rect x="30" y="276" width="280" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="44" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">6 · The result returns</text><text x="44" y="315" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">evidence, never instruction:</text><text x="44" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">untrusted-input.md</text><text x="44" y="351" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Guardrails, input side</text><rect x="30" y="456" width="280" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="44" y="478" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">7 · Finished, or stop and ask</text><text x="44" y="495" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">every step ends on « Done when: »</text><text x="44" y="512" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">else one sentence: what is missing</text><text x="44" y="531" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Agent loop</text><rect x="340" y="456" width="280" height="104" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="354" y="478" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">8 · Draft, approve, send</text><text x="354" y="495" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">drafts in work/; you send</text><text x="354" y="512" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">AUTOMATIONS.md: drafts only</text><text x="354" y="531" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Guardrails, output side</text><rect x="650" y="456" width="280" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="664" y="478" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">9 · The hand-off is written</text><text x="664" y="495" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">STATE.json: done, next, blocked</text><text x="664" y="512" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">then a git commit</text><text x="664" y="531" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Checkpointing</text><path d="M310 148.0H336" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M620 148.0H646" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M790.0 200V272" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M650 328.0H624" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M340 328.0H314" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M170.0 276V236H480.0V204" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="325.0" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">not done yet: the loop goes round again</text><path d="M170.0 380V452" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="180.0" y="420" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">done</text><path d="M310 508.0H336" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M620 508.0H646" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="30" y="599" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="50" y="611" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">added in v1.1 — the four gaps the six-concept check found</text><rect x="482.40000000000003" y="599" width="14" height="14" rx="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="502.40000000000003" y="611" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">already in the method</text></svg>
