<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Universal method, customised in two files"><title>Universal method, customised in two files</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start">Universal method, customised in two files</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Swap a chief of staff for a finance controller: ROLE.md and the role skills change. AGENTS.md changes by one line.</text><rect x="28" y="110" width="250" height="104" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="42" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">ABOUT_US.md</text><text x="42" y="149" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the organisation</text><text x="42" y="166" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">written once, by a person</text><text x="42" y="183" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">shared by every harness</text><rect x="28" y="244" width="250" height="104" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="42" y="266" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">ROLE.md</text><text x="42" y="283" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">what this harness is for</text><text x="42" y="300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">written once per role</text><text x="42" y="317" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the only file that changes</text><rect x="318" y="190" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="393" y="218" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">hoi-govern</text><text x="393" y="238" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">generates, invents nothing</text><path d="M278 162H300V210H316" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M278 296H300V236H316" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="512" y="96" width="420" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="526" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">AGENTS.md — the contract</text><text x="526" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">how to work: read first, cite, stop and ask, hand off</text><text x="526" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">identical in every harness except its first line:</text><text x="526" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">You are the &lt;role&gt; harness for &lt;organisation&gt;…</text><rect x="512" y="214" width="420" height="86" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="526" y="236" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">RULES · TOOLS · GOALS · MEMORY · EVALS …</text><text x="526" y="253" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the detail AGENTS.md points to</text><text x="526" y="270" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">from the two input files, « to complete » where silent</text><rect x="512" y="314" width="420" height="86" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><text x="526" y="336" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">skills/ — the procedures</text><text x="526" y="353" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">15 core skills: ship with the method, the same everywhere</text><text x="526" y="370" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">role skills: written from ROLE.md by hoi-skill-author</text><path d="M468 222H490V148H510" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M468 222H510" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M468 230H490V356H510" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="28" y="428" width="904" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="46" y="454" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">The generality test</text><text x="46" y="476" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">A new role adds a ROLE.md and its role skills, and changes nothing else. If it needs an edit to hoi-govern or hoi-skill-author, the method has a defect.</text></svg>
