name: Prepare candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run publication:prepare
      - run: npm run format:check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  candidate:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run package:candidate -- --output "${{ runner.temp }}/hoi-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: hoi-os-local-candidate
          path: |
            ${{ runner.temp }}/hoi-candidate/hoi-os-hub.zip
            ${{ runner.temp }}/hoi-candidate/skills/
            ${{ runner.temp }}/hoi-candidate/START_HERE.md
            ${{ runner.temp }}/hoi-candidate/CANDIDATE.json
            ${{ runner.temp }}/hoi-candidate/SHA256SUMS
          if-no-files-found: error
